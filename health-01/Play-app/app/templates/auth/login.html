{% extends "base.html" %}

{% block title %}Staff Login{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <h1>Staff Sign In</h1>
            <p class="auth-subtitle">Healthcare &amp; Administration Access Portal</p>
        </div>

        <form method="POST" action="{{ url_for('auth_routes.login') }}" class="auth-form">
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    class="form-control" 
                    placeholder="e.g. dr_sharma" 
                    required 
                    autofocus
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="form-control" 
                    placeholder="Enter your password" 
                    required 
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" class="btn btn-primary btn-block">Sign In</button>
        </form>

        <div class="auth-footer">
            <p>🔒 Authorized personnel only. All access attempts are recorded in the security audit log.</p>
        </div>
    </div>
</div>
{% endblock %}
