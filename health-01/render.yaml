services:
  - type: web
    name: swasthya-setu
    env: python
    buildCommand: "pip install -r requirements.txt && python seed.py"
    startCommand: "python run.py"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: MIN_GROUP_SIZE
        value: "5"
      - key: DOCTOR_RECORD_EDIT_WINDOW_HOURS
        value: "24"
